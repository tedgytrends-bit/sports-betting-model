name: CBB Research Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cbb/backtest-trigger.txt'

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q cbb/tests
      - name: Require CBBD key
        run: test -n "$CBBD_API_KEY" || (echo "Set CBBD_API_KEY repository secret" && exit 1)
      - name: Ingest historical seasons
        run: python -m cbb.cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Run year-out-of-sample backtest
        run: python -m cbb.cli backtest --seasons 2022 2023 2024 2025 2026 --test-seasons 2024 2025 2026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-backtest-reports
          path: cbb/outputs/
          if-no-files-found: ignore
