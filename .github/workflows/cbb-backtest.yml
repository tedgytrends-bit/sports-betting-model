name: CBB Research Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cbb/backtest-trigger.txt'

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cbb/data/raw
          key: cbb-historical-2022-to-2026-v3
          fail-on-cache-miss: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q cbb/tests
      - name: Ingest historical seasons
        run: python -m cbb.cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Run year-out-of-sample backtest
        run: python -m cbb.cli backtest --seasons 2022 2023 2024 2025 2026 --test-seasons 2024 2025 2026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-backtest-reports
          path: cbb/outputs/
          if-no-files-found: ignore
