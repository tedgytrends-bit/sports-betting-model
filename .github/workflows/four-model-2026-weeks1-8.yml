name: Research 2026 Weeks 1-8 Four-Model Reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/four_model_2026_weeks01_08.py"
      - "research/four_model_comparison.py"
      - "research/efficiency_feature_experiments.py"
      - "injury_model.py"
      - "model.py"
      - ".github/workflows/four-model-2026-weeks1-8.yml"

permissions:
  contents: write

concurrency:
  group: four-model-2026-weeks1-8-research
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile reconstruction modules
        run: |
          python -m py_compile model.py injury_model.py research/efficiency_feature_experiments.py research/four_model_comparison.py research/four_model_2026_weeks01_08.py
      - name: Run 2026 Weeks 1-8 four-model reconstruction
        run: python research/four_model_2026_weeks01_08.py
      - name: Commit validated research outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four_model_2026_weeks01_08/four_model_2026_weeks01_08_long.csv
          git add data/four_model_2026_weeks01_08/four_model_2026_weeks01_08_games.csv
          git add data/four_model_2026_weeks01_08/four_model_2026_weeks01_08_weekly.csv
          git add data/four_model_2026_weeks01_08/four_model_2026_weeks01_08_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish 2026 Weeks 1-8 four-model research dataset"
            git pull --rebase origin research/four-model-injury-efficiency
            git push origin HEAD:research/four-model-injury-efficiency
          fi
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-model-2026-weeks1-8
          path: data/four_model_2026_weeks01_08/
          if-no-files-found: warn
          retention-days: 30
