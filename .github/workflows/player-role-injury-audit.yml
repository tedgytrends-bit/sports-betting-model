name: Player Role Injury Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "research/build_player_role_injury_audit.py"
      - ".github/workflows/player-role-injury-audit.yml"
      - "injury_model.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: player-role-injury-audit-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build player snap-role injury audit
        run: python research/build_player_role_injury_audit.py
      - name: Commit research outputs
        run: |
          if [ -n "$(git status --porcelain data/player_injury_backtests)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/player_injury_backtests
            git commit -m "Record player role injury audit"
            git fetch origin main
            git rebase origin/main
            git push
          else
            echo "No new research outputs to commit."
          fi
