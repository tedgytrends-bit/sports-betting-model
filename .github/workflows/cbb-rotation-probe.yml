name: CBB Player Rotation API Probe
on:
  push:
    branches: [main]
    paths:
      - 'cbb/rotation-probe-trigger.txt'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m cbb.espn_ingest_probe --days 2 --limit 12
