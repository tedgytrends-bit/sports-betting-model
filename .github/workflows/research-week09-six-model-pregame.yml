name: Research Week 9 Six-Model Pregame Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/week09_six_model_pregame.py"
      - ".github/workflows/research-week09-six-model-pregame.yml"

permissions:
  contents: write

concurrency:
  group: research-week09-six-model-pregame
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Week 9 projection code
        run: python -m py_compile research/week09_six_model_pregame.py
      - name: Build research-only Week 9 projections
        run: python research/week09_six_model_pregame.py
      - name: Commit research snapshot without overwriting previous captures
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_week09_2026_six_model/
          if ! git diff --cached --quiet; then
            git commit -m "Freeze research-only Week 9 six-model pregame projection"
            git pull --rebase origin research/four-model-injury-efficiency
            git push origin HEAD:research/four-model-injury-efficiency
          fi
      - name: Upload research projections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-week09-six-model-pregame
          path: data/research_week09_2026_six_model/
          if-no-files-found: warn
          retention-days: 30
