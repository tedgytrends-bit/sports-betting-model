name: Research 2026 Four-Model Disagreement Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/four_model_2026_disagreement_analysis.py"
      - "data/four_model_2026_weeks01_08/four_model_2026_weeks01_08_games.csv"
      - ".github/workflows/four-model-2026-disagreement-analysis.yml"

permissions:
  contents: write

concurrency:
  group: four-model-2026-disagreement-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile disagreement analysis
        run: python -m py_compile research/four_model_2026_disagreement_analysis.py
      - name: Run disagreement attribution test
        run: python research/four_model_2026_disagreement_analysis.py
      - name: Commit validated research outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four_model_2026_weeks01_08/disagreement_analysis/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 2026 four-model disagreement attribution results"
            git pull --rebase origin research/four-model-injury-efficiency
            git push origin HEAD:research/four-model-injury-efficiency
          fi
      - name: Upload disagreement outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-model-2026-disagreement-analysis
          path: data/four_model_2026_weeks01_08/disagreement_analysis/
          if-no-files-found: warn
          retention-days: 30
