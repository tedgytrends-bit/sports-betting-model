name: Test NFLMeta API connection

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify NFLMeta credentials and quota
        env:
          NFLMETA_API_KEY: ${{ secrets.NFLMETA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.environ.get("NFLMETA_API_KEY", "").strip()
          if not key:
              raise SystemExit("NFLMETA_API_KEY secret is missing or empty.")

          request = Request(
              "https://nflmeta.org/api/v1/usage",
              headers={"X-NFLMeta-Key": key, "Accept": "application/json"},
              method="GET",
          )
          try:
              with urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")[:500]
              raise SystemExit(f"NFLMeta API check failed ({exc.code}): {detail}")
          except URLError as exc:
              raise SystemExit(f"Could not reach NFLMeta API: {exc.reason}")
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"NFLMeta returned an invalid JSON response: {exc}")

          data = payload.get("data", {})
          print("NFLMeta authentication: SUCCESS")
          for label, field in [
              ("Plan", "billing_plan"),
              ("Requests remaining this month", "quota_remaining"),
              ("Monthly request limit", "quota_limit"),
              ("Rows remaining this month", "row_quota_remaining"),
              ("Monthly row limit", "row_quota_limit"),
              ("Per-minute request limit", "minute_limit"),
          ]:
              print(f"{label}: {data.get(field, 'not returned')}")
          PY
