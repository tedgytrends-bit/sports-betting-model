name: CBB Player API Schema Probe
on:
  push:
    branches: [main]
    paths:
      - 'cbb/player-schema-trigger.txt'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m cbb.player_schema_probe
