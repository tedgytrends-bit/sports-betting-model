name: Audit Detroit-Miami Week 9 injury sensitivity (research only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/audit_week09_det_mia_projection.py"
      - ".github/workflows/audit-week09-det-mia-injury-sensitivity.yml"

permissions:
  contents: write

concurrency:
  group: audit-week09-det-mia
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: pip install -r requirements.txt
      - name: Reproduce final Detroit-Miami model and audit injury sensitivity
        run: python research/audit_week09_det_mia_projection.py
      - name: Archive research-only diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qb_epa_shadow/det_mia_injury_sensitivity_20261108.json
          git commit -m "Archive Detroit Miami Week 9 injury sensitivity audit"
          git pull --rebase origin main
          git push origin HEAD:main
