name: Test efficiency feature integrity

on:
  push:
    paths:
      - "nflmeta_injury_analysis.py"
      - "tests/**"
      - "PROJECT_HANDOFF.md"
      - ".github/workflows/test-feature-integrity.yml"
  pull_request:
    paths:
      - "app.py"
      - "pages/**"
      - "model.py"
      - "research/**"
      - "tests/**"
      - ".github/workflows/test-feature-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install pandas numpy scikit-learn requests
      - name: Compile app, model, research audit, and tests
        run: python -m compileall -q app.py pages model.py research tests
      - name: Run synthetic feature integrity tests
        run: python -m unittest discover -s tests -v
