name: CBB Research Unit Tests

on:
  pull_request:
    paths:
      - 'cbb/**'
      - '.github/workflows/cbb-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q cbb/tests
