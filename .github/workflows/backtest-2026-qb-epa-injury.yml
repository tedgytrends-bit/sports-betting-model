name: Compare 2026 Injury model vs QB EPA replacements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backtest-2026-qb-epa-injury.yml"
      - "research/backtest_2026_actual_qb_epa.py"

permissions:
  contents: write

concurrency:
  group: backtest-2026-qb-epa-injury
  cancel-in-progress: false

jobs:
  run-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: |
          python -m py_compile qb_epa_model.py injury_model.py research/backtest_2026_actual_qb_epa.py
          python -m pytest -q tests/test_qb_epa_model.py
      - name: Grade 2026 Weeks 1-8
        run: python -u research/backtest_2026_actual_qb_epa.py
      - name: Commit audit only
        run: |
          if [ -n "$(git status --porcelain data/qb_epa_shadow)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/qb_epa_shadow
            git commit -m "Record 2026 Week 1-8 QB EPA injury holdout audit"
            git pull --rebase origin main
            git push
          fi
