name: CBB Opponent-Adjusted V3 Comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cbb/opponent-v3-trigger.txt'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q cbb/tests
      - uses: actions/cache@v4
        with:
          path: cbb/data/raw
          key: cbb-historical-2022-to-2026-v3
      - name: Read cached historical game and market records
        run: python -m cbb.cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Read cached roster and previous-player records
        run: python -m cbb.player_cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Four-model matched-game out-of-sample comparison
        run: python -m cbb.opponent_experiment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-opponent-v3-comparison
          path: cbb/outputs/opponent_v3/
          if-no-files-found: ignore
