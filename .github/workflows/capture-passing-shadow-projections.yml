name: Capture research-only passing-model shadow projections

on:
  workflow_dispatch:
  schedule:
    - cron: "25 10 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture-passing-shadow-projections.yml"
      - "research/capture_passing_shadow_projections.py"

permissions:
  contents: write

concurrency:
  group: passing-shadow-projections
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate research-only paired projections
        run: python research/capture_passing_shadow_projections.py
      - name: Commit shadow outputs only
        run: |
          if [ -n "$(git status --porcelain data/prospective_passing_shadow)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prospective_passing_shadow
            git commit -m "Capture research-only passing model shadow projections"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No new passing shadow projections created."
          fi
