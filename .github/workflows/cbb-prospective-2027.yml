name: CBB 2026-27 Pregame Shadow Snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '5 13 * 11,12,1,2,3,4 *'
  push:
    branches: [main]
    paths:
      - 'cbb/prospective-trigger.txt'

permissions:
  contents: write

concurrency:
  group: cbb-2027-shadow-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      CBB_PUBLISH_BRANCH: cbb-prospective
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify unit tests
        run: python -m pytest -q cbb/tests
      - name: Verify CBBD API key
        run: test -n "$CBBD_API_KEY" || (echo "Missing CBBD_API_KEY" && exit 1)
      - uses: actions/cache@v4
        with:
          path: cbb/data/raw
          key: cbb-historical-2022-to-2026-v3
      - name: Historical baseline game cache
        run: python -m cbb.cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Historical player-input cache
        run: python -m cbb.player_cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Fetch fresh 2026-27 games and lines
        run: python -m cbb.cli fetch --seasons 2027 --refresh --through-days 9
      - name: Fetch current roster and previous-season player talent
        run: python -m cbb.player_cli fetch --seasons 2027 --refresh-roster-only
      - name: Build future-only model snapshot
        run: python -m cbb.prospective --season 2027 --horizon-days 8 --freeze-hours 24
      - name: Publish immutable pretip frozen records to isolated branch
        run: python -m cbb.prospective_publish
      - name: Grade newly final games against first frozen pretip snapshots
        run: python -m cbb.prospective_grade --season 2027
      - name: Preserve runner snapshot as audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-prospective-capture-${{ github.run_id }}
          path: cbb/outputs/prospective/
          if-no-files-found: ignore
          retention-days: 90
