name: Build static X / Open Graph website preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_social_preview.py"
      - ".github/workflows/build-social-preview.yml"

permissions:
  contents: write

concurrency:
  group: generate-social-preview-main
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate social image
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python scripts/build_social_preview.py
      - name: Commit only the generated public PNG
        run: |
          if [ -n "$(git status --porcelain docs/social-preview.png)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/social-preview.png
            git commit -m "Publish branded Tedgy Trends social preview image"
            git pull --rebase origin main
            git push
          else
            echo "Social preview unchanged"
          fi
