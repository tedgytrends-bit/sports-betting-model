name: Research Injury Recent-Regime Training Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/injury_recent_regime_training_window.py"
      - ".github/workflows/injury-recent-regime-training-window.yml"

permissions:
  contents: write

concurrency:
  group: injury-recent-regime-training-window
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recent-regime analysis
        run: python -m py_compile research/injury_recent_regime_training_window.py
      - name: Run recent-regime training-window analysis
        run: python research/injury_recent_regime_training_window.py
      - name: Commit validated research outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four_model_2026_weeks01_08/recent_regime_training_window/
          if ! git diff --cached --quiet; then
            git commit -m "Publish injury recent-regime training-window analysis"
            git pull --rebase origin research/four-model-injury-efficiency
            git push origin HEAD:research/four-model-injury-efficiency
          fi
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: injury-recent-regime-training-window
          path: data/four_model_2026_weeks01_08/recent_regime_training_window/
          if-no-files-found: warn
          retention-days: 30
