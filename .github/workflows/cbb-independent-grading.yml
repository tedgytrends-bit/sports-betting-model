name: CBB independent grading audit
on:
  workflow_dispatch:
  schedule:
    - cron: '35 12,16 * 11,12,1,2,3,4 *'
  push:
    branches: [main]
    paths:
      - 'cbb/espn-grade-trigger.txt'
permissions:
  contents: write
concurrency:
  group: cbb-independent-official-grading
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q cbb/tests
      - name: Grade verified ESPN finals against frozen games
        run: python -m cbb.espn_grade --days 30 --publish
