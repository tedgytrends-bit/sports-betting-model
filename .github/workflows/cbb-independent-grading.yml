name: CBB independent grading audit
on:
  workflow_dispatch:
  schedule:
    - cron: '35 12,16 * 11,12,1,2,3,4 *'
  push:
    branches: [main]
    paths:
      - 'cbb/espn-grade-trigger.txt'
      - '.github/workflows/cbb-independent-grading.yml'
permissions:
  contents: write
concurrency:
  group: cbb-independent-official-grading
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cbb-prospective
          path: archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q cbb/tests
      - name: Grade verified ESPN finals against frozen games
        run: python -m cbb.espn_grade --days 30 --publish --checkout
      - working-directory: archive
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add cbb/prospective/2027
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile ESPN finals and publish official frozen-model records"
          for attempt in 1 2 3; do
            git push origin HEAD:cbb-prospective && exit 0
            git pull --rebase origin cbb-prospective || exit 1
          done
          exit 1
