name: Verify Week10 Miami starter McCord and capture separate pregame score

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/publish_week10_mia_mccord_correction.py"
      - ".github/workflows/publish-week10-mia-mccord.yml"

permissions:
  contents: write

concurrency:
  group: week10-miami-qb-mccord-pregame-fix
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NFL modeling and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check source gate and actual QB player ID
        run: |
          python -m py_compile scripts/publish_week10_mia_mccord_correction.py
          python -m pytest -q tests/test_qb_confirmation_gate.py tests/test_qb_epa_model.py tests/test_qb_expected_starters.py tests/test_qb_verified_only_sensitivity.py
      - name: Re-run actual 2026 Week10 Injury model with Kyle McCord
        run: python -u scripts/publish_week10_mia_mccord_correction.py
      - name: Require verified evidence and unchanged original archives
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("data/public_snapshots")
          path=root/"nfl_week10_mia_ind_mccord_corrected_2026-11-15.csv"
          df=pd.read_csv(path)
          manifest=json.loads((root/"nfl_week10_mia_ind_mccord_corrected_2026-11-15_manifest.json").read_text())
          assert len(df)==1
          x=df.iloc[0]
          assert x.game_id=="2026_10_MIA_IND" and x.away_qb_name=="Kyle McCord"
          assert x.new_qb_id=="00-0040014"
          assert x.away_qb_starter_source=="verified_pregame"
          assert x.publication_status=="MIA_IND_KYLE_MCCORD_PREGAME_SOURCE_CORRECTION"
          assert pd.to_datetime(x.published_at_utc,utc=True)<pd.to_datetime(x.kickoff_utc,utc=True)
          assert abs(x.projected_away+x.projected_home-x.projected_total)<.02
          assert x.previous_incorrect_qb=="Malik Willis"
          assert manifest["source_verified_for_miami"]
          old=pd.read_csv(root/"nfl_week10_sunday_pregame_2026-11-15.csv")
          assert len(old)==26
          assert old.loc[old.game_id.eq("2026_10_MIA_IND")&old.model.eq("injury")].iloc[0].away_qb_name=="Malik Willis"
          assert len(pd.read_csv(root/"nfl_week10_initial_projections_2026-11-12.csv"))==28
          print("PASS: exactly one Miami game corrected; independently timestamped before kickoff; former published versions immutable")
          PY
      - name: Commit only new McCord correction archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_snapshots/nfl_week10_mia_ind_mccord_corrected_2026-11-15.csv data/public_snapshots/nfl_week10_mia_ind_mccord_corrected_2026-11-15_manifest.json
          git commit -m "Archive primary-source-verified Kyle McCord pregame Injury correction"
          git pull --rebase origin main
          git push origin HEAD:main
