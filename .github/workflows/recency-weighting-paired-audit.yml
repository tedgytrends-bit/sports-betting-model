name: Research Recency Weighting Paired Audit

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/recency_weighting_paired_audit.py"
      - ".github/workflows/recency-weighting-paired-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile paired audit
        run: python -m py_compile research/recency_weighting_paired_audit.py
      - name: Run paired audit
        run: python research/recency_weighting_paired_audit.py
      - name: Commit paired audit output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four_model_2026_weeks01_08/recency_weighting/baseline_injury_recency_weighting_paired_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish recency-weighting paired audit"
            git pull --rebase origin research/four-model-injury-efficiency
            git push origin HEAD:research/four-model-injury-efficiency
          fi
