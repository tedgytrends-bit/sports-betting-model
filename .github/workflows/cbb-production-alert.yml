name: CBB production failure alert
on:
  workflow_run:
    workflows: ["CBB 2026-27 Pregame Shadow Snapshots", "CBB independent grading audit", "CBB daily ESPN research board", "CBB archived research recovery", "CBB five-model ESPN capture", "CBB ESPN season inputs"]
    types: [completed]
permissions:
  issues: write
concurrency:
  group: cbb-alert-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false
jobs:
  alert:
    if: contains(fromJSON('["failure","timed_out","success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const title = 'CBB production failure — ' + run.name
            const body = 'Run ' + run.run_number + ' ended with ' + run.conclusion + '. ' + run.html_url
            const repo = context.repo
            const issues = await github.paginate(github.rest.issues.listForRepo, {...repo, state: 'open', per_page: 100})
            const issue = issues.find(item => item.title === title && item.user.login === 'github-actions[bot]')
            if (run.conclusion === 'success') {
              if (issue && Date.parse(issue.updated_at) < Date.parse(run.run_started_at)) {
                await github.rest.issues.update({...repo, issue_number: issue.number, state: 'closed',
                  state_reason: 'completed', body: issue.body + '\n\nRecovered in ' + run.html_url})
              }
              return
            }
            if (issue) {
              await github.rest.issues.createComment({...repo, issue_number: issue.number, body})
            } else {
              await github.rest.issues.create({...repo, title, body})
            }
