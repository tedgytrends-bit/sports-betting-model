name: Produce one QB EPA-aware Injury forecast

on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: "2026"
      week:
        description: Week to forecast
        required: true
        default: "10"
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-qb-aware-injury.yml"
      - "scripts/capture_qb_aware_injury.py"

permissions:
  contents: read

concurrency:
  group: produce-qb-aware-injury
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Validate QB and Injury engine
        run: |
          python -m py_compile qb_epa_model.py injury_model.py scripts/capture_qb_aware_injury.py research/validate_qb_starter_confirmations.py
          python -m pytest -q tests/test_qb_epa_model.py tests/test_qb_confirmation_gate.py tests/test_qb_verified_only_sensitivity.py
      - name: Generate versioned pregame research snapshot
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
          WEEK: ${{ github.event.inputs.week || '10' }}
        run: python -u scripts/capture_qb_aware_injury.py --season "$SEASON" --week "$WEEK"
      - name: Store research artifact for deliberate pregame release
        uses: actions/upload-artifact@v4
        with:
          name: qb-aware-injury-weekly
          path: data/qb_epa_shadow/injury_qb_epa_*
          if-no-files-found: error
          retention-days: 30
