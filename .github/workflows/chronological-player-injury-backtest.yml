
name: Run Chronological Player Injury Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chronological-player-injury-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit historical player injury data coverage
        run: python research/audit_player_injury_data.py

      - name: Audit historical player value source coverage
        run: python research/audit_player_value_sources.py

      - name: Run chronological baseline vs player-injury backtest
        run: python research/chronological_player_injury_backtest.py

      - name: Grade baseline vs player-injury betting results
        run: python research/grade_player_injury_backtest.py

      - name: Commit research outputs
        run: |
          if [ -n "$(git status --porcelain data/player_injury_backtests)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/player_injury_backtests
            git commit -m "Record chronological player injury betting backtest"
            git push
          else
            echo "No new backtest outputs to commit."
          fi
