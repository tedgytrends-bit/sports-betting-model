
name: Run Chronological Player Injury Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chronological-player-injury-backtest.yml"
      - "research/**"
      - "injury_model.py"
      - "player_injury_model.py"
      - "model.py"
      - "requirements.txt"

concurrency:
  group: chronological-player-injury-backtest-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  chronological-player-injury-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit historical player injury data coverage
        run: python research/audit_player_injury_data.py

      - name: Audit historical player value source coverage
        run: python research/audit_player_value_sources.py

      - name: Audit historical player stats to injury-report ID joins
        run: python research/audit_player_value_join.py

      - name: Build longitudinal point-in-time player value audit
        run: python research/build_longitudinal_player_value_audit.py

      - name: Audit historical QB depth-chart replacements
        run: python research/audit_qb_depth_chart_replacements.py

      - name: Audit point-in-time QB replacement value
        run: python research/audit_qb_replacement_value.py

      - name: Estimate research-only QB EPA point impact
        run: python research/audit_qb_point_impact.py

      - name: Run chronological baseline vs player-injury backtest
        run: python research/chronological_player_injury_backtest.py

      - name: Grade baseline vs player-injury betting results
        run: python research/grade_player_injury_backtest.py

      - name: Commit research outputs
        run: |
          if [ -n "$(git status --porcelain data/player_injury_backtests)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/player_injury_backtests
            git commit -m "Record chronological player injury betting backtest"
            # Rebase output-only changes onto the latest remote main.
            git fetch origin main
            git rebase origin/main
            git push
          else
            echo "No new backtest outputs to commit."
          fi
