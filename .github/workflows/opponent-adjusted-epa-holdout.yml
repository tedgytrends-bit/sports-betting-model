name: Evaluate NFL opponent-adjusted EPA (research only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/opponent_adjusted_epa_holdout.py"
      - ".github/workflows/opponent-adjusted-epa-holdout.yml"

permissions:
  contents: write

concurrency:
  group: opponent-adjusted-epa-nfl-research
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Check syntax and run chronological opponent-adjusted EPA audit
        run: |
          python -m py_compile research/opponent_adjusted_epa_holdout.py
          python -u research/opponent_adjusted_epa_holdout.py
      - name: Validate report coverage and leak-free historical game set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          folder=Path("data/week09_review")
          report=json.loads((folder/"opponent_adjusted_epa_holdout_20261109.json").read_text())
          assert report["status"]=="RESEARCH_ONLY_OPPONENT_ADJUSTED_EPA"
          assert report["same_day_leakage_test"]=="PASSED"
          assert report["baseline_reproduction_max_abs_score_error"]<1e-4
          assert len(report["candidate_variants"])==6
          for results in report["outcomes_by_season"].values():
              assert results["2025"]["games"]==285 and results["2026"]["games"]==121
          f=pd.read_csv(folder/"opponent_adjusted_epa_holdout_20261109.csv")
          assert len(f)==1021*6 and not f.duplicated(["game_id","research_variant"]).any()
          assert f.loc[f.season.eq(2026),"week"].max()==8
          assert (folder/"opponent_adjusted_epa_holdout_20261109.md").is_file()
          print("PASS: 6 research variants, identical games, no 2026 Week 9 leakage")
          PY
      - name: Archive research only, never update public projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/week09_review/opponent_adjusted_epa_holdout_20261109.csv data/week09_review/opponent_adjusted_epa_holdout_20261109.json data/week09_review/opponent_adjusted_epa_holdout_20261109.md
          if ! git diff --cached --quiet; then
            git commit -m "Archive opponent-adjusted EPA historical research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
