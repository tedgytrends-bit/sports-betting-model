name: Capture prospective efficiency-model projections

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospective-efficiency-projections
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install pandas numpy requests scikit-learn
      - name: Generate frozen efficiency-model projections
        run: python scripts/capture_efficiency_projections.py
      - name: Commit prospective efficiency projections
        run: |
          if [ -n "$(git status --porcelain data/prospective_ats_tracking)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prospective_ats_tracking/efficiency_projection_*.csv
            git commit -m "Capture prospective efficiency-model projections"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No efficiency projection rows created."
          fi
