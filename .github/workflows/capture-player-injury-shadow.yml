name: Capture Player-Level Injury Shadow Projections

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  player-injury-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build player-level shadow projections
        run: python scripts/capture_player_injury_shadow.py
      - name: Commit shadow outputs
        run: |
          if [ -n "$(git status --porcelain data/player_injury_shadow)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/player_injury_shadow
            git commit -m "Capture player-level injury shadow projections"
            git push
          else
            echo "No new shadow outputs to commit."
          fi
