name: CBB Rotation V4 Historical Comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cbb/rotation-v4-trigger.txt'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify player-rotation and prior chronology tests
        run: python -m pytest -q cbb/tests
      - uses: actions/cache@v4
        with:
          path: cbb/data/raw
          key: cbb-historical-2022-to-2026-v3
      - name: Load game results and bookmaker line records
        run: python -m cbb.cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Load season roster, previous-player, recruiting and transfer records
        run: python -m cbb.player_cli fetch --seasons 2022 2023 2024 2025 2026
      - uses: actions/cache@v4
        with:
          path: cbb/data/rotation
          key: cbb-rotation-game-boxes-2022-to-2026-v1
      - name: Fetch prior game-by-game player minutes and starters (one-time cache)
        run: python -m cbb.rotation_ingest --seasons 2022 2023 2024 2025 2026
      - name: Four-model 2024-26 chronological comparison
        run: python -m cbb.rotation_experiment
      - name: Preserve experiment CSVs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-rotation-v4-comparison
          path: cbb/outputs/rotation_v4/
          if-no-files-found: ignore
          retention-days: 90
