name: Research Injury ATS Threshold Stability

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/injury_threshold_stability.py"
      - "research/four_model_comparison.py"
      - "research/efficiency_feature_experiments.py"
      - "injury_model.py"
      - "model.py"
      - ".github/workflows/injury-threshold-stability.yml"

permissions:
  contents: write

concurrency:
  group: injury-threshold-stability-research
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile threshold stability analysis
        run: python -m py_compile model.py injury_model.py research/efficiency_feature_experiments.py research/four_model_comparison.py research/injury_threshold_stability.py
      - name: Run Injury threshold stability analysis
        run: python research/injury_threshold_stability.py
      - name: Commit validated research outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four_model_2026_weeks01_08/threshold_stability/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Injury ATS threshold stability analysis"
            git pull --rebase origin research/four-model-injury-efficiency
            git push origin HEAD:research/four-model-injury-efficiency
          fi
      - name: Upload threshold stability outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: injury-ats-threshold-stability
          path: data/four_model_2026_weeks01_08/threshold_stability/
          if-no-files-found: warn
          retention-days: 30
