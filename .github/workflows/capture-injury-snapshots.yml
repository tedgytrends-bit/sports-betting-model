name: Capture NFL injury snapshots

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Capture upcoming-week injury snapshot
        run: python scripts/capture_injury_snapshot.py
      - name: Commit snapshot if one was created
        run: |
          if [ -n "$(git status --porcelain data/injury_snapshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/injury_snapshots/*.csv
            git commit -m "Capture dated NFL injury snapshot"
            git push
          else
            echo "No new snapshot to commit."
          fi
