name: Capture Week 10 confirmed Sunday QB corrections (shadow)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/capture_week10_qb_corrections.py"
      - ".github/workflows/capture-week10-qb-corrections.yml"

permissions:
  contents: write

concurrency:
  group: week10-qb-corrected-pregame-shadow
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source and frozen published archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: QB source gate and prediction tests
        run: |
          python -m py_compile scripts/capture_week10_qb_corrections.py
          python -m pytest -q tests/test_qb_confirmation_gate.py tests/test_qb_epa_model.py tests/test_qb_expected_starters.py
      - name: Produce independent 2-game QB correction snapshot
        run: python -u scripts/capture_week10_qb_corrections.py
      - name: Verify correction sample and first publication unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=Path("data/public_snapshots")
          before=pd.read_csv(p/"nfl_week10_initial_projections_2026-11-12.csv")
          after=pd.read_csv(p/"nfl_week10_qb_corrected_2026-11-12.csv")
          meta=json.loads((p/"nfl_week10_qb_corrected_2026-11-12_manifest.json").read_text())
          assert len(before)==28 and before.game_id.nunique()==14
          assert len(after)==2 and set(after.game_id)=={"2026_10_LA_ARI","2026_10_SEA_LV"}
          assert set(after.model)=={"injury"} and meta["games_updated"]==2
          assert after.apply(lambda x: abs(x.projected_home+x.projected_away-x.projected_total)<.02,axis=1).all()
          assert all(pd.to_datetime(after.published_at_utc,utc=True)<pd.to_datetime(after.kickoff_utc,utc=True))
          assert (after.qb_prior_dropbacks>=0).all()
          print("PASS: two pregame shadow updates and immutable initial 28-row model archive")
          PY
      - name: Commit only new immutable research files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_snapshots/nfl_week10_qb_corrected_2026-11-12.csv
          git add data/public_snapshots/nfl_week10_qb_corrected_2026-11-12_manifest.json
          git commit -m "Save Week 10 Sunday QB source corrected shadow, preserve Thursday public freeze"
          git pull --rebase origin main
          git push origin HEAD:main
