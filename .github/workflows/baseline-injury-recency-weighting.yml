name: Research Baseline-Injury Recency Weighting

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/baseline_injury_recency_weighting.py"
      - "research/injury_recent_regime_training_window.py"
      - "injury_model.py"
      - "model.py"
      - ".github/workflows/baseline-injury-recency-weighting.yml"

permissions:
  contents: write

concurrency:
  group: baseline-injury-recency-weighting-research
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recency-weighting analysis
        run: python -m py_compile research/baseline_injury_recency_weighting.py
      - name: Run recency-weighting analysis
        run: python research/baseline_injury_recency_weighting.py
      - name: Commit validated research outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four_model_2026_weeks01_08/recency_weighting/
          if ! git diff --cached --quiet; then
            git commit -m "Publish baseline-injury recency-weighting research outputs"
            git pull --rebase origin research/four-model-injury-efficiency
            git push origin HEAD:research/four-model-injury-efficiency
          fi
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-injury-recency-weighting
          path: data/four_model_2026_weeks01_08/recency_weighting/
          if-no-files-found: warn
          retention-days: 30
