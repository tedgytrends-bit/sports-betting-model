name: Publish Tedgy Trends site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/public_results/**"
      - ".github/workflows/deploy-tedgy-trends.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Tedgy Trends public NFL results after completed game days"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "tedgy-trends-pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm site artifact is present
        run: test -s docs/index.html
      - name: Stage validated public results under same-origin Pages assets
        run: |
          mkdir -p docs/data/public_results
          cp data/public_results/nfl_2026_game_kickoffs.csv docs/data/public_results/
          cp data/public_results/nfl_2026_graded_games.csv docs/data/public_results/
          cp data/public_results/nfl_2026_results_summary.csv docs/data/public_results/
          cp data/public_results/nfl_2026_full_directional_games.csv docs/data/public_results/
          cp data/public_results/nfl_2026_full_directional_summary.csv docs/data/public_results/
          cp data/public_results/nfl_2026_full_directional_policy.json docs/data/public_results/
          cp data/public_results/nfl_2026_results_metadata.json docs/data/public_results/
          test -s docs/data/public_results/nfl_2026_full_directional_games.csv
          test -s docs/data/public_results/nfl_2026_full_directional_summary.csv
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the current site artifact to become discoverable
        uses: actions/github-script@v7
        env:
          SITE_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 10; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                name: process.env.SITE_ARTIFACT,
                per_page: 100,
              });
              const matches = response.data.artifacts.filter(
                artifact => artifact.name === process.env.SITE_ARTIFACT && !artifact.expired
              );
              if (matches.length === 1) return;
              if (matches.length > 1) throw new Error("Duplicate current-attempt site artifact");
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error("Uploaded site artifact did not become discoverable");
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
