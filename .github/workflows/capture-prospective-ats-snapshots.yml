name: Capture prospective ATS snapshots

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospective-ats-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy requests
      - name: Capture upcoming-game market and injury status
        run: python scripts/capture_ats_market_snapshot.py
      - name: Commit prospective tracking rows
        run: |
          if [ -n "$(git status --porcelain data/prospective_ats_tracking)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prospective_ats_tracking/*.csv
            git commit -m "Capture prospective ATS market snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No prospective tracking rows created."
          fi
