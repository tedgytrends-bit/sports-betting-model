name: Automated historical ATS and totals audit

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-model-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run chronological ATS and totals audit
        run: python scripts/run_historical_audit.py
      - name: Commit audit outputs
        run: |
          if [ -n "$(git status --porcelain research/reports)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/reports/*.csv research/reports/*.json
            git commit -m "Update automated historical model audit"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Audit output did not change."
          fi
