name: Smoke test simple Tedgy Trends public site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "pages/Results.py"
      - "pages/Week_09_Projection_Board.py"
      - "pages/Week_10_Projection_Board.py"
      - "pages/Public_Projection_Board.py"
      - "data/four_model_week08/week08_four_model_comparison.csv"
      - "data/public_snapshots/nfl_week_09_six_model_research_2026-11-04.csv"
      - "data/public_snapshots/nfl_week09_injury_qb_epa_margin_2026-11-05.csv"
      - "data/public_snapshots/nfl_week09_final_injury_2026-11-08.csv"
      - "data/public_snapshots/nfl_week09_kickoffs_2026.csv"
      - "docs/index.html"
      - "docs/week09.html"
      - "data/public_snapshots/nfl_week10_initial_projections_2026-11-12.csv"
      - "data/public_snapshots/nfl_week10_bovada_initial_2026-11-12.csv"
      - "data/bovada_lines.csv"
      - ".github/workflows/smoke-test-public-site.yml"

permissions:
  contents: read

jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Validate Tedgy Trends website JS syntax and the QB-aware snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,csv,math
          html=Path("docs/index.html").read_text(encoding="utf-8")
          js=re.search(r"<script>(.*?)</script>",html,re.S)
          assert js, "Missing website app script"
          Path("/tmp/tedgy-site.js").write_text(js.group(1),encoding="utf-8")
          archived=Path("docs/week09.html").read_text(encoding="utf-8")
          assert "nfl_week09_injury_qb_epa_margin_2026-11-05.csv" in archived
          assert "nfl_week09_final_injury_2026-11-08.csv" in archived
          assert "data.games=buildWeek9(data.rows9,data.market,data.injuryV2,data.finalInjury,data.kickoffs)" in archived
          assert "tnf.completed=true" in archived
          assert "COMPLETED · ORIGINAL TNF" in archived
          assert "data.games=buildWeek10(data.week10,data.market)" in html
          assert "nfl_week10_initial_projections_2026-11-12.csv" in html
          assert 'data-model="baseline"' in html and 'data-model="injury"' in html
          assert "INITIAL · QB CHECK PENDING" in html
          assert "Initial · Nov 12" in html
          assert "Date.parse(a.kickoffUtc)-Date.parse(b.kickoffUtc)" in html
          assert "week09.html" in html
          # The Week 10 homepage has exactly two public model views.
          assert 'id="model-select"' not in html
          # X/social crawlers cannot execute the site's JS. Social tags and
          # the referenced 1200x630 PNG must exist in static HTML and docs.
          head=html.split("</head>",1)[0]
          social="https://tedgytrends-bit.github.io/sports-betting-model/social-preview.png"
          assert 'name="twitter:card" content="summary_large_image"' in head
          assert f'name="twitter:image" content="{social}"' in head
          assert f'property="og:image" content="{social}"' in head
          image=Path("docs/social-preview.png").read_bytes()
          assert image.startswith(bytes.fromhex("89504e470d0a1a0a")), "Invalid social PNG"
          import struct
          assert struct.unpack(">II",image[16:24])==(1200,630), "Wrong social image dimensions"
          assert len(image)<5_000_000, "Social image exceeds safe X card size"
          with Path("data/public_snapshots/nfl_week09_injury_qb_epa_margin_2026-11-05.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==15 and len({r["game_id"] for r in rows})==15
          for r in rows:
              assert r["model"]=="injury"
              a,h,t=(float(r[k]) for k in ("projected_away","projected_home","projected_total"))
              assert all(map(math.isfinite,(a,h,t))) and abs(a+h-t)<.02
          print("Verified archived Week 9 QB-aware Injury scores for 15 games")
          with Path("data/public_snapshots/nfl_week09_final_injury_2026-11-08.csv").open() as f:
              final=list(csv.DictReader(f))
          assert len(final)==14 and len({r["game_id"] for r in final})==14
          assert "2026_09_JAX_BAL" not in {r["game_id"] for r in final}
          assert set(r["game_id"] for r in final)==set(r["game_id"] for r in rows)-{"2026_09_JAX_BAL"}
          assert {r["published_at_utc"] for r in final} and len({r["published_at_utc"] for r in final})==1
          for r in final:
              assert r["model"]=="injury"
              assert r["publication_status"]=="FINAL_PREGAME_2026_WEEK09_SUN_MON"
              assert float(r["home_injury_report_available"])==1.0
              assert float(r["away_injury_report_available"])==1.0
              a,h,t=(float(r[k]) for k in ("projected_away","projected_home","projected_total"))
              assert all(map(math.isfinite,(a,h,t))) and abs(a+h-t)<.02
          with Path("data/public_snapshots/nfl_week09_kickoffs_2026.csv").open() as f:
              kickoffs=list(csv.DictReader(f))
          assert len(kickoffs)==15 and len({r["game_id"] for r in kickoffs})==15
          assert {r["game_id"] for r in kickoffs}=={r["game_id"] for r in rows}
          assert sum(r["week9_status"]=="Completed" for r in kickoffs)==1
          assert next(r for r in kickoffs if r["week9_status"]=="Completed")["game_id"]=="2026_09_JAX_BAL"
          from datetime import datetime
          ordered=sorted(kickoffs,key=lambda r: datetime.fromisoformat(r["kickoff_utc"].replace("Z","+00:00")))
          assert ordered[0]["game_id"]=="2026_09_JAX_BAL", "Thursday must be first"
          assert ordered[1]["game_id"]=="2026_09_CIN_ATL", "Sunday morning game must precede Seattle"
          assert ordered[-1]["game_id"]=="2026_09_BUF_MIN", "Monday night must be last"
          assert {r["game_id"] for r in final}=={r["game_id"] for r in ordered[1:]}
          print("PASS: 15 Week 9 games in kickoff order, original TNF forecast preserved, 14 finals unchanged")
          with Path("data/public_snapshots/nfl_week10_initial_projections_2026-11-12.csv").open() as f:
              initial=list(csv.DictReader(f))
          with Path("data/public_snapshots/nfl_week10_bovada_initial_2026-11-12.csv").open() as f:
              week10market=list(csv.DictReader(f))
          assert len(initial)==28 and len({r["game_id"] for r in initial})==14
          assert len(week10market)==14
          assert {r["model"] for r in initial}=={"baseline","injury"}
          assert {r["game_id"] for r in initial}=={
              "2026_10_"+r["away_team"]+"_"+r["home_team"] for r in week10market
          }
          from datetime import datetime, timezone
          for r in initial:
              assert datetime.fromisoformat(r["published_at_utc"].replace("Z","+00:00"))<datetime.fromisoformat(r["kickoff_utc"].replace("Z","+00:00"))
              a,h,t=(float(r[k]) for k in ("projected_away","projected_home","projected_total"))
              assert all(map(math.isfinite,(a,h,t))) and abs(a+h-t)<.02
          print("PASS: 14 Week 10 games, both initial models, preserved Bovada quotes and pregame timing")
          PY
          node --check /tmp/tedgy-site.js
      - name: Test actual routed app and historical links
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=90).run()

          def verify(label):
              exceptions = [str(x.message) for x in app.exception]
              errors = [str(x.message) for x in app.error]
              assert not exceptions, f"{label}: exceptions {exceptions}"
              assert not errors, f"{label}: error banners {errors}"
              assert len(app.dataframe) >= 1, f"{label}: expected rendered data table"
              print("PASS:", label, "tables:", len(app.dataframe))

          verify("Week 10 public landing")
          app.switch_page("pages/Week_09_Projection_Board.py").run()
          verify("Week 9 archive page")
          app.switch_page("pages/Results.py").run()
          verify("Public results record from Week 8")
          assert any("Week 8" in str(x.body) for x in app.subheader), "Results Week 8 heading missing"
          app.switch_page("pages/Public_Projection_Board.py").run()
          verify("Original Week 8 permalink preserved")
          PY
