name: Smoke test simple Tedgy Trends public site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "pages/Results.py"
      - "pages/Week_09_Projection_Board.py"
      - "pages/Week_10_Projection_Board.py"
      - "pages/Public_Projection_Board.py"
      - "data/four_model_week08/week08_four_model_comparison.csv"
      - "data/public_snapshots/nfl_week_09_six_model_research_2026-11-04.csv"
      - "data/public_snapshots/nfl_week09_injury_qb_epa_margin_2026-11-05.csv"
      - "data/public_snapshots/nfl_week09_final_injury_2026-11-08.csv"
      - "data/public_snapshots/nfl_week09_kickoffs_2026.csv"
      - "docs/index.html"
      - "docs/week09.html"
      - "docs/week10.html"
      - "docs/public-results.js"
      - "tests/public-results-dom-smoke.cjs"
      - "data/public_results/nfl_2026_graded_games.csv"
      - "data/public_results/nfl_2026_results_summary.csv"
      - "data/public_snapshots/nfl_week10_initial_projections_2026-11-12.csv"
      - "data/public_snapshots/nfl_week10_bovada_initial_2026-11-12.csv"
      - "data/public_snapshots/nfl_week10_bovada_sunday_2026-11-15T1256Z.csv"
      - "data/public_snapshots/nfl_week10_sunday_pregame_2026-11-15.csv"
      - "data/public_snapshots/nfl_week10_sunday_official_injury_designations_2026-11-15.csv"
      - "data/public_snapshots/nfl_week10_ne_det_official_inactives_2026-11-15.csv"
      - "data/public_snapshots/nfl_week10_ne_det_inactives_adjusted_2026-11-15.csv"
      - "data/public_snapshots/nfl_week10_mia_ind_mccord_corrected_2026-11-15.csv"
      - "data/public_snapshots/nfl_week10_qb_identity_crosscheck_2026-11-15.csv"
      - "data/qb_starters/2026_week10_confirmed.csv"
      - "data/qb_starters/2026_week10_watchlist.csv"
      - "data/bovada_lines.csv"
      - ".github/workflows/smoke-test-public-site.yml"

permissions:
  contents: read

jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Validate Tedgy Trends website JS syntax and the QB-aware snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,csv,math
          html=Path("docs/index.html").read_text(encoding="utf-8")
          js=re.search(r"<script>(.*?)</script>",html,re.S)
          assert js, "Missing website app script"
          Path("/tmp/tedgy-site.js").write_text(js.group(1),encoding="utf-8")
          archived=Path("docs/week09.html").read_text(encoding="utf-8")
          assert "nfl_week09_injury_qb_epa_margin_2026-11-05.csv" in archived
          assert "nfl_week09_final_injury_2026-11-08.csv" in archived
          assert "data.games=buildWeek9(data.rows9,data.market,data.injuryV2,data.finalInjury,data.kickoffs)" in archived
          assert "tnf.completed=true" in archived
          assert "COMPLETED · ORIGINAL TNF" in archived
          assert "data.games=buildWeek10(data.week10,data.market)" in html
          assert "nfl_week10_initial_projections_2026-11-12.csv" in html
          assert 'data-model="baseline"' in html and 'data-model="injury"' in html
          fresh=Path("docs/week10.html").read_text(encoding="utf-8")
          assert "FINAL INJURY REPORT" in fresh
          assert "nfl_week10_final_injury_designations_2026-11-12.csv" in fresh
          assert "INACTIVES PENDING" not in fresh.upper()
          assert 'name="tedgy-page-revision"' in fresh
          assert "FINAL INJURY REPORT" in html
          assert "INACTIVES PENDING" not in html
          assert "nfl_week10_final_injury_designations_2026-11-12.csv" in html
          with Path("data/public_snapshots/nfl_week10_final_injury_designations_2026-11-12.csv").open() as f:
              injury_status=list(csv.DictReader(f))
          assert len(injury_status)==6
          assert {r["final_game_status"] for r in injury_status}=={"OUT","QUESTIONABLE","NO_GAME_DESIGNATION"}
          assert {r["player_name"] for r in injury_status if r["final_game_status"]=="OUT"}=={"Lucas Patrick","Colson Yankoff"}
          assert {r["player_name"] for r in injury_status if r["final_game_status"]=="QUESTIONABLE"}=={"Malik Harrison"}
          assert "Initial · Nov 12" in html
          assert "Date.parse(a.kickoffUtc)-Date.parse(b.kickoffUtc)" in html
          assert "week09.html" in html
          # The Week 10 homepage has exactly two public model views.
          assert 'id="model-select"' not in html
          # X/social crawlers cannot execute the site's JS. Social tags and
          # the referenced 1200x630 PNG must exist in static HTML and docs.
          head=html.split("</head>",1)[0]
          social="https://tedgytrends-bit.github.io/sports-betting-model/social-preview.png"
          assert 'name="twitter:card" content="summary_large_image"' in head
          assert f'name="twitter:image" content="{social}"' in head
          assert f'property="og:image" content="{social}"' in head
          image=Path("docs/social-preview.png").read_bytes()
          assert image.startswith(bytes.fromhex("89504e470d0a1a0a")), "Invalid social PNG"
          import struct
          assert struct.unpack(">II",image[16:24])==(1200,630), "Wrong social image dimensions"
          assert len(image)<5_000_000, "Social image exceeds safe X card size"
          with Path("data/public_snapshots/nfl_week09_injury_qb_epa_margin_2026-11-05.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==15 and len({r["game_id"] for r in rows})==15
          for r in rows:
              assert r["model"]=="injury"
              a,h,t=(float(r[k]) for k in ("projected_away","projected_home","projected_total"))
              assert all(map(math.isfinite,(a,h,t))) and abs(a+h-t)<.02
          print("Verified archived Week 9 QB-aware Injury scores for 15 games")
          with Path("data/public_snapshots/nfl_week09_final_injury_2026-11-08.csv").open() as f:
              final=list(csv.DictReader(f))
          assert len(final)==14 and len({r["game_id"] for r in final})==14
          assert "2026_09_JAX_BAL" not in {r["game_id"] for r in final}
          assert set(r["game_id"] for r in final)==set(r["game_id"] for r in rows)-{"2026_09_JAX_BAL"}
          assert {r["published_at_utc"] for r in final} and len({r["published_at_utc"] for r in final})==1
          for r in final:
              assert r["model"]=="injury"
              assert r["publication_status"]=="FINAL_PREGAME_2026_WEEK09_SUN_MON"
              assert float(r["home_injury_report_available"])==1.0
              assert float(r["away_injury_report_available"])==1.0
              a,h,t=(float(r[k]) for k in ("projected_away","projected_home","projected_total"))
              assert all(map(math.isfinite,(a,h,t))) and abs(a+h-t)<.02
          with Path("data/public_snapshots/nfl_week09_kickoffs_2026.csv").open() as f:
              kickoffs=list(csv.DictReader(f))
          assert len(kickoffs)==15 and len({r["game_id"] for r in kickoffs})==15
          assert {r["game_id"] for r in kickoffs}=={r["game_id"] for r in rows}
          assert sum(r["week9_status"]=="Completed" for r in kickoffs)==1
          assert next(r for r in kickoffs if r["week9_status"]=="Completed")["game_id"]=="2026_09_JAX_BAL"
          from datetime import datetime
          ordered=sorted(kickoffs,key=lambda r: datetime.fromisoformat(r["kickoff_utc"].replace("Z","+00:00")))
          assert ordered[0]["game_id"]=="2026_09_JAX_BAL", "Thursday must be first"
          assert ordered[1]["game_id"]=="2026_09_CIN_ATL", "Sunday morning game must precede Seattle"
          assert ordered[-1]["game_id"]=="2026_09_BUF_MIN", "Monday night must be last"
          assert {r["game_id"] for r in final}=={r["game_id"] for r in ordered[1:]}
          print("PASS: 15 Week 9 games in kickoff order, original TNF forecast preserved, 14 finals unchanged")
          with Path("data/public_snapshots/nfl_week10_initial_projections_2026-11-12.csv").open() as f:
              initial=list(csv.DictReader(f))
          with Path("data/public_snapshots/nfl_week10_bovada_initial_2026-11-12.csv").open() as f:
              week10market=list(csv.DictReader(f))
          assert len(initial)==28 and len({r["game_id"] for r in initial})==14
          assert len(week10market)==14
          assert {r["model"] for r in initial}=={"baseline","injury"}
          assert {r["game_id"] for r in initial}=={
              "2026_10_"+r["away_team"]+"_"+r["home_team"] for r in week10market
          }
          from datetime import datetime, timezone
          for r in initial:
              assert datetime.fromisoformat(r["published_at_utc"].replace("Z","+00:00"))<datetime.fromisoformat(r["kickoff_utc"].replace("Z","+00:00"))
              a,h,t=(float(r[k]) for k in ("projected_away","projected_home","projected_total"))
              assert all(map(math.isfinite,(a,h,t))) and abs(a+h-t)<.02
          print("PASS: 14 Week 10 games, both initial models, preserved Bovada quotes and pregame timing")
          with Path("data/public_snapshots/nfl_week10_bovada_sunday_2026-11-15T1256Z.csv").open() as f:
              sunday_quotes=list(csv.DictReader(f))
          with Path("data/public_snapshots/nfl_week10_sunday_pregame_2026-11-15.csv").open() as f:
              sunday_models=list(csv.DictReader(f))
          with Path("data/public_snapshots/nfl_week10_sunday_official_injury_designations_2026-11-15.csv").open() as f:
              sunday_injury=list(csv.DictReader(f))
          with Path("data/public_snapshots/nfl_week10_ne_det_official_inactives_2026-11-15.csv").open() as f:
              ne_det_inactives=list(csv.DictReader(f))
          with Path("data/public_snapshots/nfl_week10_ne_det_inactives_adjusted_2026-11-15.csv").open() as f:
              revised_ne_det=list(csv.DictReader(f))
          assert len(sunday_quotes)==13 and len(sunday_models)==26
          assert set(x["game_id"] for x in sunday_models)=={
              "2026_10_"+x["away_team"]+"_"+x["home_team"] for x in sunday_quotes
          }
          assert len({(x["game_id"],x["model"]) for x in sunday_models})==26
          assert {x["model"] for x in sunday_models}=={"injury","baseline"}
          assert len(sunday_injury)==169 and len({x["team"] for x in sunday_injury})==26
          assert len(ne_det_inactives)==20
          assert {x["final_active_status"] for x in ne_det_inactives}=={"INACTIVE","ACTIVE_CONFIRMED"}
          assert len(revised_ne_det)==1 and revised_ne_det[0]["game_id"]=="2026_10_NE_DET"
          for p in (html,fresh):
              assert "nfl_week10_sunday_pregame_2026-11-15.csv" in p
              assert "nfl_week10_sunday_official_injury_designations_2026-11-15.csv" in p
              assert "nfl_week10_ne_det_official_inactives_2026-11-15.csv" in p
              assert "nfl_week10_ne_det_inactives_adjusted_2026-11-15.csv" in p
              assert "SUNDAY_NOV15_PREINACTIVES_PREGAME_INJURY_REFRESH" in p
              assert "NE_DET_OFFICIAL_GAMEDAY_INACTIVES_PREGAME_UPDATE" in p
          for x in sunday_models+revised_ne_det:
              assert datetime.fromisoformat(x["published_at_utc"].replace("Z","+00:00"))<datetime.fromisoformat(x["kickoff_utc"].replace("Z","+00:00"))
              a,h,t=(float(x[k]) for k in ("projected_away","projected_home","projected_total"))
              assert all(map(math.isfinite,(a,h,t))) and abs(a+h-t)<.02
          print("PASS: Sunday 13 Bovada quotes, 26 refreshed model rows, 169 official injuries, NE-DET official actives/inactives and chronological score")
          with Path("data/public_snapshots/nfl_week10_mia_ind_mccord_corrected_2026-11-15.csv").open() as f:
              mccord_fix=list(csv.DictReader(f))
          with Path("data/public_snapshots/nfl_week10_qb_identity_crosscheck_2026-11-15.csv").open() as f:
              qb_audit=list(csv.DictReader(f))
          with Path("data/qb_starters/2026_week10_watchlist.csv").open() as f:
              watchlist=list(csv.DictReader(f))
          assert len(mccord_fix)==1 and len(qb_audit)==26
          assert len({r["team"] for r in qb_audit})==26
          assert all(r["corrected_matches_reference"]=="true" for r in qb_audit)
          assert sum(r["previous_matches_reference"]=="false" for r in qb_audit)==1
          assert {r["team"] for r in qb_audit if r["previous_matches_reference"]=="false"}=={"MIA"}
          assert sum(r["source_evidence_type"]=="TEAM_CONFIRMED" for r in qb_audit)==5
          assert sum(r["source_evidence_type"]=="COACH_EXPECTED_NOT_FINAL" for r in qb_audit)==1
          assert sum(r["source_evidence_type"]=="SECONDARY_CORROBORATED_NOT_GAME_DAY_CONFIRMED" for r in qb_audit)==20
          q=mccord_fix[0]
          assert q["game_id"]=="2026_10_MIA_IND" and q["away_qb_name"]=="Kyle McCord"
          assert q["previous_incorrect_qb"]=="Malik Willis" and q["new_qb_id"]=="00-0040014"
          assert q["new_qb_prior_dropbacks"] in ("0","0.0")
          assert q["away_qb_starter_source"]=="verified_pregame"
          assert q["publication_status"]=="MIA_IND_KYLE_MCCORD_PREGAME_SOURCE_CORRECTION"
          assert datetime.fromisoformat(q["published_at_utc"].replace("Z","+00:00"))<datetime.fromisoformat(q["kickoff_utc"].replace("Z","+00:00"))
          assert any(r["game_id"]=="2026_10_MIA_IND" and r["player_name"]=="Malik Willis" and r["starter_confirmation_status"]=="IR_REPORTED" for r in watchlist)
          for html_text in (html,fresh):
              assert "nfl_week10_mia_ind_mccord_corrected_2026-11-15.csv" in html_text
              assert "nfl_week10_qb_identity_crosscheck_2026-11-15.csv" in html_text
              assert "MIA_IND_KYLE_MCCORD_PREGAME_SOURCE_CORRECTION" in html_text
              assert "PASS — uncalibrated rookie QB" in html_text
          print("PASS: Official McCord starter, IR Willis rejected, 26 audited QBs, rookie-EPA ATS PASS, and original Sunday forecast preserved")


          PY
          node --check /tmp/tedgy-site.js
          node --check docs/public-results.js
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path("data/public_results")
          with (d/"nfl_2026_graded_games.csv").open() as f:
              games=list(csv.DictReader(f))
          with (d/"nfl_2026_results_summary.csv").open() as f:
              summary=list(csv.DictReader(f))
          assert len(games)>=86 and len(summary)>=8
          assert {r["model"] for r in games}=={"injury","baseline"}
          assert all(r["score_status"] in ("FINAL","PENDING") for r in games)
          assert sum(r["week"]=="9" and r["model"]=="baseline" and r["record_class"]=="RESEARCH_COMPARATOR" for r in games)==15
          for file in ("docs/index.html","docs/week10.html"):
              text=Path(file).read_text()
              assert '<script src="./public-results.js"></script>' in text
              assert "resultsGames:'data/public_results/nfl_2026_graded_games.csv'" in text
              assert "window.renderPublicResults(data)" in text
              assert 'id="results-week-filter"' in text and 'id="results-day-filter"' in text
          Path("/tmp/tedgy-public-results.json").write_text(json.dumps({"resultsGames":games,"resultsSummary":summary}))
          print("PASS: both public pages load the same cumulative results dataset, 15 Week9 research Baseline games separate")
          PY
          node tests/public-results-dom-smoke.cjs /tmp/tedgy-public-results.json
      - name: Test actual routed app and historical links
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py", default_timeout=90).run()

          def verify(label):
              exceptions = [str(x.message) for x in app.exception]
              errors = [str(x.message) for x in app.error]
              assert not exceptions, f"{label}: exceptions {exceptions}"
              assert not errors, f"{label}: error banners {errors}"
              assert len(app.dataframe) >= 1, f"{label}: expected rendered data table"
              print("PASS:", label, "tables:", len(app.dataframe))

          verify("Week 10 public landing")
          app.switch_page("pages/Week_09_Projection_Board.py").run()
          verify("Week 9 archive page")
          app.switch_page("pages/Results.py").run()
          verify("Auto-updated Week8 onward public results")
          assert any("Week-by-week performance" in str(x.body) for x in app.subheader), "Results weekly summary missing"
          assert any("Game-by-game results" in str(x.body) for x in app.subheader), "Results per-game table missing"
          assert len(app.dataframe)>=2, "Results needs weekly and game tables"
          app.switch_page("pages/Public_Projection_Board.py").run()
          verify("Original Week 8 permalink preserved")
          PY
