name: Research Four-Model Injury and Efficiency Comparison

on:
  workflow_dispatch:
  push:
    branches:
      - "research/four-model-injury-efficiency"
    paths:
      - "research/four_model_comparison.py"
      - "research/four_model_upcoming_projection.py"
      - "research/four_model_week08_reconstruction.py"
      - "pages/Four_Model_Week8_Comparison.py"
      - "app.py"
      - "research/injury_coverage_audit.py"
      - "injury_model.py"
      - ".github/workflows/four-model-comparison.yml"
  pull_request:
    paths:
      - "research/four_model_comparison.py"
      - "research/four_model_week08_reconstruction.py"
      - "pages/Four_Model_Week8_Comparison.py"
      - "app.py"
      - "research/injury_coverage_audit.py"
      - "research/efficiency_feature_experiments.py"
      - "injury_model.py"
      - "model.py"
      - ".github/workflows/four-model-comparison.yml"

permissions:
  contents: read

jobs:
  four-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile research modules
        run: |
          python -m py_compile model.py injury_model.py research/efficiency_feature_experiments.py research/four_model_comparison.py research/injury_coverage_audit.py research/four_model_week08_reconstruction.py
      - name: Run four-model upcoming-game projection
        run: python research/four_model_upcoming_projection.py
      - name: Run four-model chronological comparison
        run: python research/four_model_comparison.py
      - name: Reconstruct Week 8 four-model public comparison
        run: python research/four_model_week08_reconstruction.py
      - name: Run historical injury coverage audit
        run: python research/injury_coverage_audit.py
      - name: Upload research-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-model-injury-efficiency-comparison
          path: |
            data/four_model_comparison/
            data/four_model_week08/
            data/injury_coverage_audit/
          if-no-files-found: warn
          retention-days: 30
