name: Capture sportsbook odds snapshots

on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospective-sportsbook-odds
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Capture bookmaker odds
        if: ${{ secrets.ODDS_API_KEY != '' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGIONS: us
          ODDS_API_MARKETS: spreads,totals
        run: python scripts/capture_sportsbook_odds.py
      - name: Report missing API key
        if: ${{ secrets.ODDS_API_KEY == '' }}
        run: echo "ODDS_API_KEY repository secret is not configured; capture skipped without failure."
      - name: Commit odds snapshots
        run: |
          if [ -n "$(git status --porcelain data/prospective_ats_tracking)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prospective_ats_tracking/sportsbook_odds_*.csv
            git commit -m "Capture bookmaker-specific NFL odds snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No sportsbook odds snapshots created."
          fi
