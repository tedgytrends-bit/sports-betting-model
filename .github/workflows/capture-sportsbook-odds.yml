name: Capture one EndzoneAPI sportsbook odds snapshot

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: "One NFL game ID, e.g. 2026_09_KC_BUF (one request; provider charges credits)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: endzoneapi-single-game-odds
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Capture one game's odds from EndzoneAPI
        env:
          ENDZONE_API_KEY: ${{ secrets.ENDZONE_API_KEY }}
          ENDZONE_GAME_ID: ${{ inputs.game_id }}
        run: python scripts/capture_sportsbook_odds.py
      - name: Commit immutable odds snapshot
        run: |
          if [ -n "$(git status --porcelain data/prospective_ats_tracking)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prospective_ats_tracking/endzone_odds_*.csv
            git commit -m "Capture EndzoneAPI odds for ${{ inputs.game_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No EndzoneAPI odds snapshot created."
          fi
