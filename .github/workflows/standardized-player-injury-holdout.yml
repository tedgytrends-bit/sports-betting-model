name: Test standardized and player-role NFL injury models (research only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/standardized_player_injury_holdout.py"
      - ".github/workflows/standardized-player-injury-holdout.yml"

permissions:
  contents: write

concurrency:
  group: standardized-player-injury-historical-ablation
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Sanity-check research-only code
        run: |
          python -m py_compile research/standardized_player_injury_holdout.py
      - name: Run strictly chronological standardization and injury-role ablation
        run: |
          python -u research/standardized_player_injury_holdout.py
      - name: Validate heldout games, historical baseline and no public modifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("data/week09_review")
          result=json.loads((root/"standardized_player_role_injury_holdout_20261109.json").read_text())
          assert result["status"]=="RESEARCH_ONLY_NO_PUBLIC_WEEK_9_OR_WEEK_10_CHANGES"
          assert result["no_public_change"] is True
          assert result["baseline_reproduction_max_abs_score_difference"] <= 0.0001
          assert len(result["research_models"])==8
          for k,s in result["result_summary"].items():
              assert {str(y) for y in [2022,2023,2024,2025,2026]}.issubset(s)
              assert s["2025"]["games"]==285
              assert s["2026"]["games"]==121
          p=pd.read_csv(root/"standardized_player_role_injury_holdout_20261109.csv")
          assert len(p)==1021*8
          assert p.loc[p.season.eq(2026),"week"].max()==8
          assert len(p[["game_id","research_variant"]].drop_duplicates())==len(p)
          print("PASS: 8 research candidates, identical 1021 games, no 2026 Week 9 leakage")
          PY
      - name: Save only historical research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/week09_review/standardized_player_role_injury_holdout_20261109.csv data/week09_review/standardized_player_role_injury_holdout_20261109.json data/week09_review/standardized_player_role_injury_holdout_20261109.md
          if ! git diff --cached --quiet; then
            git commit -m "Archive standardized and player-role NFL injury historical research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
