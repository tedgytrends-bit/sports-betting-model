name: Estimate EndzoneAPI odds cost (no credits)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install requests
      - name: Estimate EndzoneAPI odds costs without using credits
        env:
          ENDZONE_API_KEY: ${{ secrets.ENDZONE_API_KEY }}
        run: python scripts/estimate_endzone_odds_cost.py
