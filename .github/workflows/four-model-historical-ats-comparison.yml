name: Compare four NFL models ATS by historical season

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/four_model_historical_ats_comparison.py"
      - ".github/workflows/four-model-historical-ats-comparison.yml"

permissions:
  contents: write

concurrency:
  group: compare-four-nfl-models-historical
  cancel-in-progress: false

jobs:
  four-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run matching 2022-2026 historical ATS comparison
        run: |
          python research/four_model_historical_ats_comparison.py
      - name: Archive research-only outputs
        uses: actions/upload-artifact@v4
        with:
          name: four-model-historical-ats
          path: data/four_model_historical/*
          if-no-files-found: error
          retention-days: 60
      - name: Commit research tables for future access
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/four_model_historical/
          if ! git diff --cached --quiet; then
            git commit -m "Archive 4-model historical ATS records (research only)"
            git pull --rebase origin main
            git push origin main
          fi
