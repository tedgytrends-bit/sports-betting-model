name: CBB Player V2 Roster-Corrected Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cbb/player-v2-trigger.txt'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q cbb/tests
      - name: Verify secret exists
        run: test -n "$CBBD_API_KEY"
      - name: Ingest historical games, scores and market lines
        run: python -m cbb.cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Ingest historical target rosters and previous-season player performance
        run: python -m cbb.player_cli fetch --seasons 2022 2023 2024 2025 2026
      - name: Compare baseline versus corrected player model
        run: python -m cbb.player_cli backtest --seasons 2022 2023 2024 2025 2026 --test-seasons 2024 2025 2026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-player-v2-comparison
          path: cbb/outputs/player_v2/
          if-no-files-found: ignore
